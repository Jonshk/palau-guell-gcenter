name: palau_guell
description: "Bienvenido a la audioguía de Palau Güell"
publish_to: "none"
version: 1.4.1+15

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  ventour_connector:
    path: "C:/Users/GVAM SAT/Downloads/gvames-gvam_flutter_ventour_connector-d3988ad0ac7d"

  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21
  proximity_sensor: ^1.2.3

  cached_network_image: ^3.4.1
  sensors_plus: ^6.1.1
  flutter_blue_plus: ^1.35.10
  flutter_html: ^3.0.0
  flutter_svg: ^2.2.3
  material_symbols_icons: ^4.2815.1
  video_player: ^2.10.1
  vector_math: ^2.2.0
  battery_plus: ^7.0.0
  vr_player: ^0.3.0
  panorama_viewer: ^2.0.7
  terminate_restart: ^1.0.11
  vibration: ^3.1.7
  torch_light: ^1.1.0

  # Device Manager / sincronización
  http: ^1.2.2
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  html: 0.15.4

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.prod
    - assets/
    - assets/fonts/
    - assets/i18n/
    - assets/i18n/flags/
    - assets/icons/
    - assets/img/
    - assets/panoramic/
    - assets/svg/
  fonts:
    - family: "geist"
      fonts:
        - asset: assets/fonts/Geist-Light.ttf
          weight: 100
        - asset: assets/fonts/Geist-Regular.ttf
          style: normal
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          style: normal
          weight: 500
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: "archivo"
      fonts:
        - asset: assets/fonts/Archivo-Light.ttf
          weight: 100
        - asset: assets/fonts/Archivo-Regular.ttf
          style: normal
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          style: normal
          weight: 500
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
    - family: "NotoSansJP"
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          style: normal
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
